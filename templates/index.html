<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Job Hunter — локальный дашборд IT-вакансий с hh.ru, Habr Career и RemoteOK.">
  <title>AI Job Hunter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    .card-active { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.65); }
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 antialiased">

  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-3 px-4 py-3">
      <div class="flex items-center gap-2.5">
        <span id="health-dot" class="h-2.5 w-2.5 rounded-full bg-slate-600" title="Статус API"></span>
        <h1 class="text-lg font-semibold tracking-tight text-slate-50">AI Job Hunter</h1>
        <span id="health-label" class="text-xs text-slate-500">Проверка…</span>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <span id="last-run" class="hidden text-xs text-slate-500"></span>
        <button id="btn-scrape" type="button"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-500 active:bg-indigo-700">
          Запустить поиск
        </button>
      </div>
    </div>

    <div id="progress-wrap" class="hidden mx-auto max-w-5xl px-4 pb-3">
      <div class="mb-1 flex justify-between text-xs text-slate-400">
        <span id="progress-phase">…</span>
        <span id="progress-count">0 собрано · 0 IT · 0 сохранено</span>
      </div>
      <div class="h-1.5 w-full overflow-hidden rounded bg-slate-800">
        <div id="progress-bar" class="h-full w-0 rounded bg-indigo-500 transition-all duration-500"></div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <div id="filters" class="mb-4 flex flex-wrap items-center gap-2">
      <nav id="tabs" class="flex flex-wrap gap-1 rounded-lg bg-slate-900 p-1 text-sm"></nav>

      <input id="f-q" type="search" aria-label="Поиск вакансий"
        placeholder="Поиск по названию / компании…"
        class="w-56 rounded-lg border border-slate-800 bg-slate-900 px-3 py-1.5 text-sm outline-none placeholder:text-slate-600 focus:border-indigo-500">

      <select id="f-source" aria-label="Источник вакансий"
        class="rounded-lg border border-slate-800 bg-slate-900 px-3 py-1.5 text-sm text-slate-300 outline-none focus:border-indigo-500">
        <option value="all">Все источники</option>
        <option value="hh">hh.ru</option>
        <option value="habr">Habr Career</option>
        <option value="remoteok">RemoteOK</option>
      </select>

      <label class="inline-flex items-center gap-2 text-sm text-slate-400">
        <input id="f-remote" type="checkbox" aria-label="Только удалённые вакансии"
          class="h-4 w-4 rounded border-slate-700 bg-slate-900 accent-indigo-500">
        Удалёнка
      </label>

      <span id="count" class="ml-auto text-xs text-slate-500"></span>
    </div>

    <section id="cards" class="space-y-3"></section>

    <div id="empty" class="hidden flex-col items-center justify-center gap-3 py-20 text-center">
      <div class="text-4xl text-slate-700">∅</div>
      <p class="text-slate-400">Вакансий не найдено. Измените фильтры или запустите сбор.</p>
    </div>

    <nav id="pagination" class="mt-5 hidden flex-wrap items-center justify-center gap-2">
      <button id="pg-prev" type="button"
        class="rounded-md border border-slate-700 px-3 py-1 text-sm text-slate-300 transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40">
        ‹ Назад
      </button>
      <div id="page-buttons" class="flex flex-wrap items-center gap-1"></div>
      <button id="pg-next" type="button"
        class="rounded-md border border-slate-700 px-3 py-1 text-sm text-slate-300 transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40">
        Вперёд ›
      </button>
    </nav>

    <div id="page-info" class="mt-2 text-center text-xs text-slate-500"></div>
    <div id="stats" class="mt-3 text-xs text-slate-500"></div>
  </main>

  <footer class="mx-auto max-w-5xl space-y-3 px-4 pb-8 text-xs text-slate-600">
    <div id="attribution">
      Источники: hh.ru, Habr Career, RemoteOK.<br>
      Данные RemoteOK предоставлены
      <a href="https://remoteok.com" target="_blank" rel="noopener" class="underline-offset-2 hover:text-slate-400 hover:underline">Remote OK</a>.
    </div>
    <div>
      Горячие клавиши: <b class="text-slate-500">J/K</b> — навигация,
      <b class="text-slate-500">A</b> — лайк, <b class="text-slate-500">R</b> — скип,
      <b class="text-slate-500">O</b> — открыть, <b class="text-slate-500">/</b> — поиск,
      <b class="text-slate-500">Esc</b> — сброс.
    </div>
  </footer>

  <div id="toasts" class="fixed bottom-4 right-4 z-50 w-80 max-w-[90vw] space-y-2"></div>

  <script src="/static/app.js"></script>
</body>
</html>
