    - "Основы Spring Boot"
    - "Git, базовые Linux-команды"
  nice_to_have:
    - "Python"
    - "JS / TypeScript"
    - "LLM / RAG / AI-агенты"

ai_skills:
  - "AI-агенты: Claude Code, OpenCode, DeepSeek harness"
  - "Локальные LLM: Qwen (до 27B), Ollama, LM Studio"
  - "AI-assisted development / Vibe Coding: быстрое прототипирование с LLM"

# ---------- Проекты (1-3, с результатами) ----------
projects:
  - name: "AI Job Hunter"
    url: "https://github.com/your-username/ai-job-hunter"
    description: "Локальный агент поиска работы: парсинг hh.ru, оценка вакансий локальной LLM (Ollama), генерация сопроводительных писем. FastAPI + SQLite + Qwen 14B."
  - name: "Пример проекта"
    url: ""
    description: "Описание + измеримый результат (метрика, скорость, качество)."

# ---------- Достижения ----------
achievements:
  - "Собрал локальный AI-пайплайн на Ollama (Qwen 14B) с JSON-контрактом, ретраями и кэшированием."

# ---------- Dealbreakers ----------
# Если слово найдено в вакансии — она автоматически пропускается (без LLM).
# Формулировки должны быть устойчивы к регистру.
dealbreakers:
  - "senior"
  - "lead"
  - "старший"
  - "ведущий"
  - "3+ лет"
  - "5+ лет"
  - "продаж"
  - "sales"
  - "call center"
  - "колл-центр"
