name: "Иван Петров"            # имя для подписи писем
role: "Junior Java-разработчик с уклоном в AI-инженерию"
email: "you@example.com"
phone: ""
github: "https://github.com/your-username"
portfolio: ""                  # ссылки на проекты / портфолио

city: "Москва"
